services:
  # ─── PostgreSQL with pgvector ───────────────────────────────
  db:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: issuecompass_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-issuecompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issuecompass}
      POSTGRES_DB: ${POSTGRES_DB:-issuecompass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuecompass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Redis (caching + rate limiting + background workers) ──
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: issuecompass_redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: issuecompass_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # PORT must match the container port in the `ports` mapping below and the
      # NEXT_PUBLIC_API_URL used by the frontend (http://backend:8000).
      # Render injects its own PORT at runtime; compose sets it explicitly here
      # so the container listens on 8000 (the Dockerfile default of 8080 would
      # otherwise leave port 8000 dead and the frontend unable to reach us).
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-issuecompass}:${POSTGRES_PASSWORD:-issuecompass}@db:5432/${POSTGRES_DB:-issuecompass}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_ENABLED: "true"
      JINA_API_KEY: ${JINA_API_KEY}
      JINA_EMBED_MODEL: ${JINA_EMBED_MODEL:-jina-embeddings-v3}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      REDIS_MAX_CONNECTIONS: "50"
      REDIS_SOCKET_TIMEOUT: "5"
      REDIS_SOCKET_CONNECT_TIMEOUT: "5"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_POOL_OVERFLOW: ${DB_POOL_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      METRICS_API_KEY: ${METRICS_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─── ARQ Background Worker ──────────────────────────────────
  # Runs scheduled index/cleanup cron jobs (see app.worker.WorkerSettings).
  # Without this service, the local issues table is never populated by the
  # scheduler and /issues/matches falls back entirely to live GitHub fetches.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: issuecompass_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-issuecompass}:${POSTGRES_PASSWORD:-issuecompass}@db:5432/${POSTGRES_DB:-issuecompass}
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_ENABLED: "true"
      JINA_API_KEY: ${JINA_API_KEY}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      # NullPool (DB_POOL_SIZE=0) is PgBouncer-safe and avoids idle
      # connections on the long-lived worker process.
      DB_POOL_SIZE: "0"
      REDIS_MAX_CONNECTIONS: "20"
      REDIS_SOCKET_TIMEOUT: "5"
      REDIS_SOCKET_CONNECT_TIMEOUT: "5"
    # Skip DB reconcile/migrations here — owned by the backend service.
    command: ["arq", "app.worker.WorkerSettings"]
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─── Next.js Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: issuecompass_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    ports:
      - "3000:8080"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
    internal: false  # allow outbound to GitHub API / AI providers
